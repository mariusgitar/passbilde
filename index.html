<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffe3ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kosedyrpass">
<title>Kosedyrpass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Caveat:wght@700&family=Courier+Prime:wght@700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}

/* Layout: three kid-sized steps (pick card → take photo → done), one big action per screen.
   Single bright look on purpose: no dark theme, every color set explicitly. */
:root {
  --tint: #ffe3ec;
  --fg: #2d2240;
  --muted: #6e6382;
  --card: #ffffff;
  --line: #f0dccb;
  --line-d: #dcc4ae;
  --pink: #e2557a;
  --pink-d: #b83a5c;
  --blue: #3f8fd2;
  --blue-d: #2a6aa3;
  --font: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
html { background: var(--tint); }
[hidden] { display: none !important; }
body {
  background: var(--tint); color: var(--fg); font-family: var(--font); font-size: 18px;
  transition: background-color .4s ease;
}
.app {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 40px;
  display: flex; flex-direction: column; gap: 16px;
}
.top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 56px; }
.top h1 { margin: 0; font-size: 1.5rem; font-weight: 700; text-align: center; grid-column: 2; }
.top h1 span { color: var(--pink); }
.back {
  justify-self: start; font: 700 1.1rem var(--font); color: var(--fg);
  background: var(--card); border: 3px solid var(--line); border-bottom-width: 6px;
  border-radius: 999px; padding: 10px 16px; min-height: 52px; cursor: pointer; white-space: nowrap;
}
.back:active { transform: translateY(2px); border-bottom-width: 4px; }
section { display: flex; flex-direction: column; gap: 16px; }
.ask { margin: 4px 0 0; font-size: 2rem; font-weight: 700; text-align: center; text-wrap: balance; line-height: 1.15; }

/* step 1: big picture tiles */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(4, 1fr); } }
.tile {
  display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 8px;
  background: var(--card); border: 3px solid var(--line); border-bottom-width: 8px; border-radius: 24px;
  padding: 12px 10px 10px; cursor: pointer; font: 700 clamp(1rem, 4.6vw, 1.3rem) var(--font); color: var(--fg); min-height: 170px; min-width: 0;
}
.tile:active { transform: translateY(4px); border-bottom-width: 4px; }
.tile .thumb { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; min-height: 96px; }
.tile img { max-width: 100%; max-height: 120px; border-radius: 10px; box-shadow: 0 3px 10px rgba(45,34,64,.15); }
.tile .lbl { display: flex; align-items: center; gap: 6px; white-space: nowrap; }

/* chunky toy buttons */
.big, .mega {
  font: 700 1.35rem var(--font); color: var(--fg); background: var(--card);
  border: 3px solid var(--line); border-bottom: 8px solid var(--line-d); border-radius: 24px;
  min-height: 80px; padding: 10px 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 10px; text-align: center;
}
.big:active, .mega:active { transform: translateY(4px); border-bottom-width: 4px; }
.mega {
  flex-direction: column; gap: 4px; min-height: 150px; font-size: 2rem;
  background: var(--blue); border-color: var(--blue); border-bottom-color: var(--blue-d); color: #fff;
}
.mega .ico { font-size: 3.4rem; line-height: 1; }
.mega.save { min-height: 104px; flex-direction: row; gap: 14px; background: var(--pink); border-color: var(--pink); border-bottom-color: var(--pink-d); }
.mega.save .ico { font-size: 2.4rem; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.link { font: 600 1.05rem var(--font); color: var(--muted); background: none; border: 0; text-decoration: underline; padding: 12px; cursor: pointer; }
.big:focus-visible, .mega:focus-visible, .tile:focus-visible, .back:focus-visible, .link:focus-visible, input:focus-visible, summary:focus-visible {
  outline: 4px solid var(--fg); outline-offset: 3px;
}
input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

/* step 3: result */
.stage { position: relative; display: flex; justify-content: center; }
.preview {
  display: block; max-width: 100%; max-height: 56vh; width: auto; height: auto;
  border-radius: 16px; box-shadow: 0 10px 28px rgba(45,34,64,.22);
  -webkit-user-drag: none; user-select: none;
}
.preview.pannable { touch-action: none; cursor: grab; }
.preview.pop { animation: pop .45s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { 0% { transform: scale(.9); } 100% { transform: scale(1); } }
.stamp {
  position: absolute; top: 50%; left: 50%; pointer-events: none;
  font: 700 clamp(1.6rem, 7vw, 3rem) var(--font); color: var(--pink); white-space: nowrap;
  border: 6px solid var(--pink); border-radius: 20px; padding: 8px 22px; background: rgba(255,255,255,.88);
  transform: translate(-50%, -50%) rotate(-12deg);
  animation: slam 1.9s cubic-bezier(.2,.9,.3,1) forwards;
}
@keyframes slam {
  0% { opacity: 0; transform: translate(-50%, -50%) rotate(-30deg) scale(3); }
  22% { opacity: 1; transform: translate(-50%, -50%) rotate(-12deg) scale(.92); }
  30% { transform: translate(-50%, -50%) rotate(-12deg) scale(1.04); }
  38%, 78% { opacity: 1; transform: translate(-50%, -50%) rotate(-12deg) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -50%) rotate(-12deg) scale(1); }
}
.shake { animation: shake .5s ease; }
@keyframes shake { 0%,100% { transform: rotate(0); } 20% { transform: rotate(-14deg); } 40% { transform: rotate(12deg); } 60% { transform: rotate(-8deg); } 80% { transform: rotate(5deg); } }
.msg { min-height: 1.4em; text-align: center; font-weight: 600; font-size: 1.2rem; margin: 0; }
.hint { font-size: 1rem; color: var(--muted); text-align: center; margin: 0; }

/* grown-up panel */
.adult { background: rgba(255,255,255,.6); border: 2px dashed var(--line-d); border-radius: 18px; padding: 4px 14px; }
.adult summary { cursor: pointer; font-weight: 600; color: var(--muted); padding: 12px 0; list-style-position: inside; }
.adult[open] { padding-bottom: 14px; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fields label { display: flex; flex-direction: column; gap: 4px; font-weight: 600; font-size: .9rem; color: var(--muted); min-width: 0; }
.fields input {
  font: 500 1.05rem var(--font); color: var(--fg); background: #fff;
  border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; width: 100%; box-sizing: border-box;
}
.fields .wide { grid-column: 1 / -1; }
.zoom { display: flex; align-items: center; gap: 10px; color: var(--muted); font-weight: 600; margin-top: 12px; }
.zoom input { flex: 1; min-width: 0; accent-color: var(--pink); }
.adult .hint { text-align: left; margin-top: 8px; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; width: 100%; height: 100%; }
@media (max-width: 400px) { .ask { font-size: 1.7rem; } .big { font-size: 1.2rem; } }
@media (prefers-reduced-motion: reduce) {
  .preview.pop, .shake { animation: none; }
  .stamp { animation: fade 1.9s linear forwards; transform: translate(-50%, -50%) rotate(-12deg); }
  @keyframes fade { 0%, 80% { opacity: 1; } 100% { opacity: 0; } }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button id="back" class="back" type="button" hidden>← Tilbake</button>
    <h1>Kosedyr<span>pass</span></h1>
  </header>

  <section id="s-pick">
    <h2 class="ask">Hva skal vi lage?</h2>
    <div class="grid" id="grid"></div>
  </section>

  <section id="s-photo" hidden>
    <h2 class="ask" id="photoTitle">Ta bilde!</h2>
    <label for="cam" class="mega" role="button"><span class="ico">📷</span><span>Ta bilde</span></label>
    <label for="lib" class="big" role="button">🖼️ Velg fra bildene</label>
    <button id="skip" class="link" type="button">Hopp over bildet</button>
  </section>

  <section id="s-done" hidden>
    <div class="stage"><img id="preview" class="preview" alt="Kortet ditt" draggable="false"><div id="stamp" class="stamp" hidden></div></div>
    <button id="save" class="mega save" type="button"><span class="ico">💾</span><span>Lagre</span></button>
    <p id="msg" class="msg" aria-live="polite"></p>
    <p id="hint" class="hint" hidden>Hold fingeren på kortet og velg «Arkiver bilde».</p>
    <div class="pair">
      <button id="dice" class="big" type="button"><span class="d">🎲</span> Finn på</button>
      <button id="rename" class="big" type="button"><span class="d">🏷️</span> Nytt navn</button>
    </div>
    <div class="pair">
      <button id="next" class="big" type="button">📷 Lag en til</button>
      <button id="swap" class="big" type="button">🧩 Annet kort</button>
    </div>
    <details class="adult" id="adult">
      <summary>✏️ Endre tekst (for voksne)</summary>
      <div class="fields" id="fields"></div>
      <div class="zoom" id="zoomRow" hidden><span>Zoom</span><input id="zoom" type="range" min="1" max="3" step="0.01" value="1" aria-label="Zoom bildet"></div>
      <p class="hint" id="panHint" hidden>Dra i kortet for å flytte bildet.</p>
    </details>
  </section>

  <input id="cam" type="file" accept="image/*" capture="environment">
  <input id="lib" type="file" accept="image/*">
</div>

<canvas id="cv" hidden></canvas>

<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const F = (w, s) => `${w} ${s}px Fredoka, "Trebuchet MS", sans-serif`;
  const CAV = s => `700 ${s}px Caveat, cursive`;
  const MONO = s => `700 ${s}px "Courier Prime", monospace`;

  // ---------- small helpers ----------
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pad2 = n => String(n).padStart(2, '0');
  const now = new Date();
  const today = `${pad2(now.getDate())}.${pad2(now.getMonth() + 1)}.${now.getFullYear()}`;
  const randDate = () => `${pad2(rint(1, 28))}.${pad2(rint(1, 12))}.${rint(2016, 2025)}`;
  const serial = (p, d = 4) => p + rint(10 ** (d - 1), 10 ** d - 1);
  function hash(s) { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; }
  function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const poss = n => /[sxz]$/i.test(n) ? n + "'" : n + 's';
  const code3 = s => (s || '???').toUpperCase().replace(/Æ/g, 'AE').replace(/Ø/g, 'O').replace(/Å/g, 'A').replace(/[^A-Z]/g, '').padEnd(3, 'X').slice(0, 3);

  function rr(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function fit(text, maxW, size, weight = 700) {
    let s = size; do { ctx.font = F(weight, s); s -= 2; } while (ctx.measureText(text).width > maxW && s > 12);
  }
  function txt(t, x, y, font, color, align = 'left', base = 'alphabetic') {
    ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base; ctx.fillText(t, x, y);
  }
  function fitTxt(t, x, y, maxW, size, color, align = 'left', weight = 700) {
    fit(t, maxW, size, weight); ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(t, x, y);
  }
  function wrap(t, x, y, maxW, lh, maxLines, font, color, align = 'left') {
    ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
    const words = (t || '').split(/\s+/); let line = '', n = 0;
    for (let i = 0; i < words.length; i++) {
      const test = line ? line + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > maxW && line) {
        if (n === maxLines - 1) { line += '…'; break; }
        ctx.fillText(line, x, y + n * lh); n++; line = words[i];
      } else line = test;
    }
    ctx.fillText(line, x, y + n * lh); return y + n * lh;
  }
  function label(t, x, y, color = '#8a7ba3', size = 19) { txt(t.toUpperCase(), x, y, F(600, size), color); }
  function star(cx, cy, r, color) {
    ctx.save(); ctx.fillStyle = color; ctx.beginPath();
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * .45 : r; ctx.lineTo(cx + Math.cos(a) * q, cy + Math.sin(a) * q); }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  function paw(cx, cy, s, color) {
    ctx.save(); ctx.fillStyle = color;
    ctx.beginPath(); ctx.ellipse(cx, cy + s * .35, s * .55, s * .45, 0, 0, Math.PI * 2); ctx.fill();
    [[-.55, -.25], [-.2, -.55], [.2, -.55], [.55, -.25]].forEach(([dx, dy]) => { ctx.beginPath(); ctx.ellipse(cx + dx * s, cy + dy * s, s * .2, s * .26, 0, 0, Math.PI * 2); ctx.fill(); });
    ctx.restore();
  }
  function waves(W, y0, n, gap, c1, c2, amp = 14) {
    ctx.save(); ctx.lineWidth = 1.4;
    for (let i = 0; i < n; i++) {
      ctx.strokeStyle = i % 2 ? c1 : c2; ctx.beginPath();
      for (let x = 0; x <= W; x += 8) { const y = y0 + i * gap + Math.sin(x / 60 + i * .5) * amp + Math.sin(x / 23 + i) * 4; x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
      ctx.stroke();
    }
    ctx.restore();
  }
  function barcode(x, y, w, h, seedStr, color = '#2d2240') {
    const r = rng(hash(seedStr)); ctx.fillStyle = color; let cx = x;
    while (cx < x + w - 6) { const bw = 2 + Math.floor(r() * 5); if (r() > .4) ctx.fillRect(cx, y, bw, h); cx += bw + 2 + Math.floor(r() * 3); }
  }
  function sig(prefix, x, y, color, size = 24, align = 'left') {
    ctx.save(); ctx.font = F(600, size); const pw = ctx.measureText(prefix + ' ').width;
    ctx.font = CAV(size * 2.3); const lw = ctx.measureText('Louie').width;
    let sx = align === 'center' ? x - (pw + lw) / 2 : x;
    txt(prefix, sx, y, F(600, size), color, 'left', 'middle');
    txt('Louie', sx + pw, y - size * .2, CAV(size * 2.3), color, 'left', 'middle');
    ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.beginPath();
    ctx.moveTo(sx + pw - 4, y + size * 1.05); ctx.quadraticCurveTo(sx + pw + lw / 2, y + size * 1.45, sx + pw + lw + 14, y + size * .85); ctx.stroke();
    ctx.restore();
  }

  // ---------- photo ----------
  const S = { tpl: 'pass', photo: null, zoom: 1, off: { x: 0, y: 0 }, name: '', skipped: false, vals: {} };
  let frame = null;

  function cameraGlyph(cx, cy, s) {
    ctx.save(); ctx.fillStyle = '#b9a6d6';
    rr(cx - s, cy - s * .6, s * 2, s * 1.3, s * .25); ctx.fill();
    rr(cx - s * .35, cy - s * .85, s * .7, s * .4, s * .1); ctx.fill();
    ctx.fillStyle = '#efe6fa'; ctx.beginPath(); ctx.arc(cx, cy + s * .05, s * .42, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#b9a6d6'; ctx.beginPath(); ctx.arc(cx, cy + s * .05, s * .26, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  function photoBox(x, y, w, h, r, circle = false) {
    ctx.save();
    if (circle) { ctx.beginPath(); ctx.arc(x + w / 2, y + h / 2, w / 2, 0, Math.PI * 2); } else rr(x, y, w, h, r);
    ctx.clip();
    if (S.photo) {
      const p = S.photo, s = Math.max(w / p.width, h / p.height) * S.zoom;
      const dw = p.width * s, dh = p.height * s;
      const mx = (dw - w) / 2 / dw, my = (dh - h) / 2 / dh;
      const ox = Math.max(-mx, Math.min(mx, S.off.x)), oy = Math.max(-my, Math.min(my, S.off.y));
      ctx.drawImage(p, x + (w - dw) / 2 + ox * dw, y + (h - dh) / 2 + oy * dh, dw, dh);
      frame = { dw, dh, mx, my };
    } else {
      ctx.fillStyle = '#efe6fa'; ctx.fillRect(x, y, w, h);
      const s = Math.min(w, h);
      cameraGlyph(x + w / 2, y + h / 2 - s * .06, s * .2);
      txt('Legg til bilde', x + w / 2, y + h / 2 + s * .26, F(600, Math.max(16, s * .075)), '#7d6a9b', 'center');
    }
    ctx.restore();
  }

  // ---------- templates ----------
  const KINDS = ['Bjørn', 'Kanin', 'Hund', 'Katt', 'Enhjørning', 'Dinosaur', 'Koala', 'Rev', 'Ugle', 'Panda', 'Menneske', 'Ekorn'];
  const T = [
    {
      id: 'pass', label: '🛂 Pass', size: [1200, 840],
      fields: [
        { k: 'kind', l: 'Type', o: KINDS },
        { k: 'born', l: 'Bursdag', g: randDate },
        { k: 'owner', l: 'Bor hos', o: ['Louie'], keep: true },
        { k: 'power', l: 'Superkraft', o: ['Verdens beste klem', 'Kan sove hvor som helst', 'Usynlig om natten', 'Jager bort mareritt', 'Supermyk', 'Kan snakke med katter', 'Holder på hemmeligheter'] },
      ],
      no: () => serial('KOS'),
      draw(v, W, H) {
        rr(0, 0, W, H, 36); ctx.clip();
        const g = ctx.createLinearGradient(0, 0, W, H);
        g.addColorStop(0, '#e8f4ff'); g.addColorStop(.5, '#fff1f6'); g.addColorStop(1, '#fff8e1');
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
        waves(W, 120, 26, 26, 'rgba(90,169,230,.16)', 'rgba(226,85,122,.12)');
        ctx.fillStyle = '#e2557a'; ctx.fillRect(0, 0, W, 104);
        txt('KOSEDYRPASS', 56, 54, F(700, 50), '#fff', 'left', 'middle');
        ctx.font = F(700, 50); const tw = 56 + ctx.measureText('KOSEDYRPASS').width;
        star(tw + 30, 50, 14, '#ffe17a'); star(tw + 58, 34, 8, '#ffe17a');
        txt('KOSEDYRLANDET', W - 56, 40, F(600, 22), '#fff', 'right', 'middle');
        txt('Pass for kosedyr · Cuddly passport', W - 56, 70, F(400, 19), '#fff', 'right', 'middle');
        ctx.fillStyle = '#fff'; rr(48, 132, 356, 446, 26); ctx.fill();
        photoBox(56, 140, 340, 430, 20);
        const fx = 450, cw = 330;
        label('Navn / Name', fx, 158); fitTxt(v.name, fx, 220, 690, 64, '#2d2240');
        label('Type / Kind', fx, 270); fitTxt(v.kind, fx, 318, cw, 42, '#2d2240');
        label('Bursdag / Birthday', fx + cw + 30, 270); fitTxt(v.born, fx + cw + 30, 318, cw, 42, '#2d2240');
        label('Bor hos / Lives with', fx, 366); fitTxt(v.owner, fx, 414, cw, 42, '#2d2240');
        label('Passnummer / No.', fx + cw + 30, 366); fitTxt(v._no, fx + cw + 30, 414, cw, 42, '#2d2240');
        label('Superkraft / Superpower', fx, 462); fitTxt(v.power, fx, 510, 520, 42, '#2d2240');
        label('Gyldig til / Expires', fx, 558); fitTxt('Aldri!', fx, 600, cw, 38, '#2d2240');
        ctx.save(); ctx.translate(1050, 520); ctx.rotate(-.22);
        ctx.strokeStyle = ctx.fillStyle = 'rgba(226,85,122,.85)';
        ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(0, 0, 76, 0, Math.PI * 2); ctx.stroke();
        ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(0, 0, 64, 0, Math.PI * 2); ctx.stroke();
        txt('GODKJENT', 0, -12, F(700, 25), 'rgba(226,85,122,.85)', 'center', 'middle');
        paw(0, 28, 24, 'rgba(226,85,122,.85)'); ctx.restore();
        ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillRect(0, 615, W, 112);
        const pc = ['#e2557a', '#5aa9e6', '#f2b705', '#6fbf8a'];
        for (let i = 0; i < 4; i++) { paw(80 + i * 62, 671, 20, pc[i % 4]); paw(W - 80 - i * 62, 671, 20, pc[(i + 2) % 4]); }
        txt('VELKOMMEN TIL KOSEDYRLANDET', W / 2, 673, F(700, 30), '#3c3156', 'center', 'middle');
        ctx.fillStyle = '#5aa9e6'; ctx.fillRect(0, 727, W, H - 727);
        sig('Utstedt av passsjef', 56, 782, '#fff');
        paw(W - 150, 784, 30, 'rgba(255,255,255,.9)'); paw(W - 80, 770, 22, 'rgba(255,255,255,.6)');
      }
    },
    {
      id: 'forer', label: '🚗 Førerkort', size: [1200, 760],

        [['Når', v.naar], ['Hvor', v.hvor], ['Ta med', v.tamed]].forEach(([l, val], i) => {
          const y = 865 + i * 72; label(l, 130, y, '#e2557a', 22); fitTxt(val, 300, y + 2, 470, 38, '#2d2240');
        });
        sig('Godkjent av festsjef', W / 2, 1120, '#e2557a', 24, 'center');
      }
    },
  ];
  const byId = Object.fromEntries(T.map(t => [t.id, t]));

  function freshVals(t, old = {}) {
    const v = {};
    t.fields.forEach(fd => { v[fd.k] = fd.keep && old[fd.k] != null ? old[fd.k] : (fd.g ? fd.g() : pick(fd.o)); });
    v._no = t.no(); return v;
  }
  T.forEach(t => S.vals[t.id] = freshVals(t));

  // ---------- kid UI ----------
  const META = {
    pass:    { e: '🛂', n: 'Pass',         bg: '#ffe3ec', stamp: 'GODKJENT!',   ask: 'Hvem skal ha pass?' },
    forer:   { e: '🚗', n: 'Førerkort',    bg: '#ffe9d6', stamp: 'BESTÅTT!',    ask: 'Hvem skal kjøre?' },
    koala:   { e: '🐨', n: 'Koalaklubben', bg: '#dff1e2', stamp: 'VELKOMMEN!',  ask: 'Hvem blir med i klubben?' },
    diplom:  { e: '🏅', n: 'Diplom',       bg: '#fff3c9', stamp: 'GRATULERER!', ask: 'Hvem får diplom?' },
    billett: { e: '✈️', n: 'Flybillett',   bg: '#dcecff', stamp: 'GOD TUR!',    ask: 'Hvem skal fly?' },
    bibl:    { e: '📚', n: 'Bibliotek',    bg: '#f6e6c8', stamp: 'GOD LESING!', ask: 'Hvem skal låne bøker?' },
    samle:   { e: '⭐', n: 'Samlekort',    bg: '#efe2ff', stamp: 'SJELDEN!',    ask: 'Hvem blir samlekort?' },
    invit:   { e: '🎉', n: 'Invitasjon',   bg: '#ffe0f0', stamp: 'HURRA!',      ask: 'Hvem har fest?' },
  };
  const PRE = ['Kaptein', 'Prinsesse', 'Herr', 'Fru', 'Lille', 'Store', 'Sir', 'Doktor', 'Professor', 'Superhelten', 'Dronning', 'Kong'];
  const NAMES = ['Klemmeklump', 'Myk', 'Snuskepus', 'Pelsedott', 'Tuss', 'Brumm', 'Fløffy', 'Snorke', 'Knøttet', 'Bobla', 'Dotten', 'Fnugg', 'Sokken', 'Pippi-Lo'];
  const genName = () => pick(PRE) + ' ' + pick(NAMES);
  S.name = genName();

  const $ = id => document.getElementById(id);
  const screens = { pick: $('s-pick'), photo: $('s-photo'), done: $('s-done') };
  const preview = $('preview'), msg = $('msg');
  let screen = 'pick';

  function show(name) {
    screen = name;
    Object.entries(screens).forEach(([k, el]) => el.hidden = k !== name);
    $('back').hidden = name === 'pick';
    document.body.style.backgroundColor = name === 'pick' ? '' : META[S.tpl].bg;
    document.documentElement.style.backgroundColor = document.body.style.backgroundColor;
    if (name === 'pick') renderThumbs();
    if (name === 'photo') $('photoTitle').textContent = META[S.tpl].ask;
    window.scrollTo(0, 0);
  }

  // rendering
  function renderNow(id) {
    const t = byId[id], [W, H] = t.size;
    if (cv.width !== W) cv.width = W; if (cv.height !== H) cv.height = H;
    ctx.clearRect(0, 0, W, H); ctx.save();
    const v = Object.assign({}, S.vals[t.id], { name: S.name.trim() || '???' });
    Object.keys(v).forEach(k => { if (typeof v[k] === 'string' && !v[k].trim()) v[k] = '—'; });
    t.draw(v, W, H); ctx.restore();
  }
  let raf = 0;
  function draw() {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => { renderNow(S.tpl); preview.src = cv.toDataURL('image/png'); });
  }
  const small = document.createElement('canvas'), sctx = small.getContext('2d');
  const thumbImgs = {};
  function renderThumbs() {
    T.forEach(t => {
      renderNow(t.id);
      const sc = 320 / Math.max(cv.width, cv.height);
      small.width = Math.round(cv.width * sc); small.height = Math.round(cv.height * sc);
      sctx.clearRect(0, 0, small.width, small.height); sctx.drawImage(cv, 0, 0, small.width, small.height);
      thumbImgs[t.id].src = small.toDataURL('image/png');
    });
  }

  // step 1 grid
  T.forEach(t => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'tile';
    const th = document.createElement('span'); th.className = 'thumb';
    const img = document.createElement('img'); img.alt = ''; thumbImgs[t.id] = img; th.appendChild(img);
    const lb = document.createElement('span'); lb.className = 'lbl'; lb.textContent = META[t.id].e + ' ' + META[t.id].n;
    b.append(th, lb);
    b.addEventListener('click', () => {
      S.tpl = t.id; renderFields();
      if (S.photo || S.skipped) { show('done'); arrive(); } else show('photo');
    });
    $('grid').appendChild(b);
  });

  // sound (made in code, starts only after a tap)
  let ac = null;
  function audio() {
    try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) { ac = null; }
    return ac;
  }
  document.addEventListener('pointerdown', audio, { passive: true });
  function thump() {
    const a = audio(); if (!a) return;
    try {
      const t0 = a.currentTime, o = a.createOscillator(), g = a.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(170, t0); o.frequency.exponentialRampToValueAtTime(45, t0 + .2);
      g.gain.setValueAtTime(.9, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + .3);
      o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + .32);
      const n = a.createBuffer(1, a.sampleRate * .08, a.sampleRate), d = n.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
      const s = a.createBufferSource(), ng = a.createGain(); s.buffer = n; ng.gain.value = .35;
      s.connect(ng).connect(a.destination); s.start(t0);
    } catch (e) {}
  }
  function pling() {
    const a = audio(); if (!a) return;
    try {
      [880, 1175, 1568].forEach((f, i) => {
        const t0 = a.currentTime + i * .09, o = a.createOscillator(), g = a.createGain();
        o.type = 'triangle'; o.frequency.value = f;
        g.gain.setValueAtTime(.25, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + .35);
        o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + .36);
      });
    } catch (e) {}
  }
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function replay(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
  function arrive() {
    msg.textContent = ''; draw();
    const st = $('stamp'); st.textContent = META[S.tpl].stamp; st.hidden = false;
    st.style.animation = 'none'; void st.offsetWidth; st.style.animation = '';
    setTimeout(thump, reduced ? 0 : 400);
    replay(preview, 'pop');
  }
  $('stamp').addEventListener('animationend', e => { e.target.hidden = true; });

  function confetti() {
    if (reduced) return;
    const c = document.createElement('canvas'); c.className = 'confetti';
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    c.width = innerWidth * dpr; c.height = innerHeight * dpr; document.body.appendChild(c);
    const x = c.getContext('2d'), cols = ['#ff7aa8', '#ffd36e', '#6fd3a6', '#8ab8ff', '#c9a2ff', '#e2557a'];
    const P = Array.from({ length: 140 }, () => ({
      x: c.width / 2 + (Math.random() - .5) * c.width * .3, y: c.height * .55,
      vx: (Math.random() - .5) * 22 * dpr, vy: -(10 + Math.random() * 16) * dpr,
      r: Math.random() * Math.PI, vr: (Math.random() - .5) * .4, s: (6 + Math.random() * 8) * dpr, c: pick(cols)
    }));
    const start = performance.now();
    (function step(t) {
      x.clearRect(0, 0, c.width, c.height);
      P.forEach(p => {
        p.vy += .55 * dpr; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.r += p.vr;
        x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore();
      });
      if (t - start < 2200) requestAnimationFrame(step); else c.remove();
    })(start);
  }

  // grown-up fields
  const fieldsEl = $('fields');
  function renderFields() {
    const t = byId[S.tpl]; fieldsEl.innerHTML = '';
    const nl = document.createElement('label'); nl.className = 'wide'; nl.textContent = 'Navn';
    const ni = document.createElement('input'); ni.id = 'f-name'; ni.value = S.name; ni.maxLength = 24; ni.autocomplete = 'off';
    ni.addEventListener('input', () => { S.name = ni.value; draw(); });
    nl.appendChild(ni); fieldsEl.appendChild(nl);
    t.fields.forEach(fd => {
      const l = document.createElement('label'); if (fd.wide) l.className = 'wide'; l.textContent = fd.l;
      const i = document.createElement('input'); i.id = `f-${t.id}-${fd.k}`; i.value = S.vals[t.id][fd.k]; i.autocomplete = 'off';
      i.maxLength = fd.num ? 2 : 48; if (fd.num) i.inputMode = 'numeric';
      i.addEventListener('input', () => { S.vals[t.id][fd.k] = i.value; draw(); });
      l.appendChild(i); fieldsEl.appendChild(l);
    });
  }

  // photo
  function setPhoto(img) {
    S.photo = img; S.zoom = 1; S.off = { x: 0, y: 0 }; $('zoom').value = 1;
    const has = !!img;
    $('zoomRow').hidden = !has; $('panHint').hidden = !has;
    preview.classList.toggle('pannable', has);
  }
  function loadFile(input) {
    const file = input.files && input.files[0]; if (!file) return;
    const img = new Image();
    img.onload = () => { setPhoto(img); show('done'); arrive(); };
    img.onerror = () => { $('photoTitle').textContent = 'Fikk ikke åpnet bildet. Prøv igjen!'; };
    img.src = URL.createObjectURL(file); input.value = '';
  }
  $('cam').addEventListener('change', e => loadFile(e.target));
  $('lib').addEventListener('change', e => loadFile(e.target));
  $('skip').addEventListener('click', () => { S.skipped = true; show('done'); arrive(); });
  $('zoom').addEventListener('input', e => { S.zoom = parseFloat(e.target.value); draw(); });

  let drag = null;
  preview.addEventListener('pointerdown', e => {
    if (!S.photo) return; e.preventDefault(); preview.setPointerCapture(e.pointerId); drag = { x: e.clientX, y: e.clientY };
  });
  preview.addEventListener('pointermove', e => {
    if (!drag || !frame) return;
    const sc = cv.width / preview.getBoundingClientRect().width;
    const cl = (v, m) => Math.max(-m, Math.min(m, v));
    S.off.x = cl(S.off.x + (e.clientX - drag.x) * sc / frame.dw, frame.mx);
    S.off.y = cl(S.off.y + (e.clientY - drag.y) * sc / frame.dh, frame.my);
    drag = { x: e.clientX, y: e.clientY }; draw();
  });
  ['pointerup', 'pointercancel'].forEach(ev => preview.addEventListener(ev, () => drag = null));

  // actions
  function wiggle(btn) { const d = btn.querySelector('.d'); if (d && !reduced) { d.style.display = 'inline-block'; replay(d, 'shake'); } }
  $('dice').addEventListener('click', e => {
    const t = byId[S.tpl]; S.vals[t.id] = freshVals(t, S.vals[t.id]); renderFields(); draw();
    wiggle(e.currentTarget); replay(preview, 'pop'); msg.textContent = '';
  });
  $('rename').addEventListener('click', e => {
    S.name = genName(); renderFields(); draw(); wiggle(e.currentTarget); replay(preview, 'pop'); msg.textContent = '';
  });
  $('next').addEventListener('click', () => {
    S.name = genName(); S.skipped = false;
    T.forEach(t => S.vals[t.id] = freshVals(t, S.vals[t.id]));
    setPhoto(null); renderFields(); show('photo');
  });
  $('swap').addEventListener('click', () => show('pick'));
  $('back').addEventListener('click', () => show('pick'));

  async function saveImage() {
    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    const safe = (S.name.trim() || 'kosedyr').replace(/[^\wæøåÆØÅ-]+/g, '-');
    const name = `${S.tpl}-${safe}.png`;
    let dl = null;
    try { dl = window.claude ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
    if (dl) {
      try { await dl.save({ filename: name, data: blob }); return 'saved'; }
      catch (e) { if (e && e.code === 'declined') return 'cancel'; if (e && e.code === 'rate_limited') return 'wait'; return 'fail'; }
    }
    if (window.claude) return 'fail';
    const file = new File([blob], name, { type: 'image/png' });
    if (matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return 'saved'; }
      catch (e) { if (e && e.name === 'AbortError') return 'cancel'; }
    }
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return 'saved';
  }
  $('save').addEventListener('click', async () => {
    renderNow(S.tpl);
    const r = await saveImage().catch(() => 'fail');
    if (r === 'saved') { msg.textContent = 'Lagret! 🎉'; pling(); confetti(); }
    else if (r === 'wait') msg.textContent = 'Vent litt og prøv igjen.';
    else if (r === 'fail') $('hint').hidden = false;
    else msg.textContent = '';
  });

  renderFields(); show('pick');
  if (document.fonts) {
    Promise.all(['700 50px Fredoka', '600 20px Fredoka', '500 20px Fredoka', '700 58px Caveat', '700 34px "Courier Prime"']
      .map(s => document.fonts.load(s).catch(() => {}))).then(() => { if (screen === 'pick') renderThumbs(); else draw(); });
  }
})();
</script>
</body>
</html>
